version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "10003:10000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.praxiswebsitescore.rule=Host(`praxiswebsitescore.creativecoding.cloud`)"
      - "traefik.http.routers.praxiswebsitescore.entrypoints=websecure"
      - "traefik.http.routers.praxiswebsitescore.tls.certresolver=letsencrypt"
      - "traefik.http.services.praxiswebsitescore.loadbalancer.server.port=10000"
      # HTTP → HTTPS Redirect
      - "traefik.http.routers.praxiswebsitescore-http.rule=Host(`praxiswebsitescore.creativecoding.cloud`)"
      - "traefik.http.routers.praxiswebsitescore-http.entrypoints=web"
      - "traefik.http.routers.praxiswebsitescore-http.middlewares=redirect-to-https-pws"
      - "traefik.http.middlewares.redirect-to-https-pws.redirectscheme.scheme=https"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://praxiswebsitescore.creativecoding.cloud
      - APP_KEY=base64:xHO8BLRp7mCsnskoMEGrF1Jmo/TH2gAFbVnTOAvmZyk=
      - TRUSTED_PROXIES=*
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/database/database.sqlite
      # Brevo SMTP
      - MAIL_MAILER=smtp
      - MAIL_HOST=smtp-relay.brevo.com
      - MAIL_PORT=587
      - MAIL_USERNAME=ae14b9001@smtp-brevo.com
      - MAIL_PASSWORD=REDACTED
      - MAIL_ENCRYPTION=tls
      - MAIL_FROM_ADDRESS=info@creativecoding.cloud
      - MAIL_FROM_NAME="Praxis Website Score"
    volumes:
      - praxis-storage:/var/www/storage
      - praxis-database:/var/www/database
    working_dir: /var/www

volumes:
  praxis-storage:
  praxis-database:
