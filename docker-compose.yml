version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "10001:10000"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://praxiswebsitescore.creativecoding.cloud
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/database/database.sqlite
    volumes:
      - praxis-storage:/var/www/storage
      - praxis-database:/var/www/database
    working_dir: /var/www

volumes:
  praxis-storage:
  praxis-database:
